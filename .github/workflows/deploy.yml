name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Sanity check
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html 缺失——Hexo 在零文章时不生成首页，请保留至少一篇占位文章"
            exit 1
          fi

      - name: Deploy to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
          user_name: bubber2018
          user_email: bubber@163.com
          commit_message: "Site updated from ${{ github.sha }}"
